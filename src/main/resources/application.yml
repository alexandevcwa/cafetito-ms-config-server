spring:
  application:
    name: cafetito-ms-config-server
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          # uri: "default"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

#encrypt:
#  key: default

server:
  port: 8070